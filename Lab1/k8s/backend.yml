apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: flask-backend:latest
          imagePullPolicy: Never        # use image built into minikube's docker, don't pull
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  type: ClusterIP                        # internal-only; ingress reaches it by name
  selector:
    app: backend
  ports:
    - port: 8000
      targetPort: 8000